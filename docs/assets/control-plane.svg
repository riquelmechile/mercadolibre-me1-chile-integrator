<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="control-plane-title control-plane-desc">
  <title id="control-plane-title">Controlled shipment lifecycle in the Mercado Libre ME1 Chile Integrator</title>
  <desc id="control-plane-desc">A four-stage lifecycle shows preview, explicit human approval, a single idempotent create attempt, and observation. A locked rail states that the carrier connection remains disabled throughout the ceremony.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a2f"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172036"/>
      <stop offset="1" stop-color="#1c2740"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect x="38" y="34" width="1204" height="572" rx="24" fill="none" stroke="#25324a"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="86" fill="#f8fafc" font-size="30" font-weight="700">Controlled shipment lifecycle</text>
    <text x="72" y="116" fill="#94a3b8" font-size="17">Provider-neutral core · exact approval boundary · safe first-production ceremony</text>

    <g transform="translate(1082 64)">
      <rect width="112" height="40" rx="20" fill="#18243b" stroke="#334155"/>
      <circle cx="22" cy="20" r="6" fill="#34d399"/>
      <text x="38" y="26" fill="#dbeafe" font-size="15" font-weight="700">v0.9.0</text>
    </g>

    <line x1="305" y1="305" x2="347" y2="305" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="610" y1="305" x2="652" y2="305" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="915" y1="305" x2="957" y2="305" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="72" y="178" width="233" height="254" rx="22" fill="#101a2d" stroke="#155e75" stroke-width="2"/>
      <rect x="92" y="198" width="88" height="30" rx="15" fill="#083344"/>
      <text x="111" y="219" fill="#67e8f9" font-size="13" font-weight="800" letter-spacing="1.2">PREVIEW</text>
      <text x="92" y="270" fill="#f8fafc" font-size="23" font-weight="700">Quote + digest</text>
      <text x="92" y="306" fill="#cbd5e1" font-size="15">Live provider quote</text>
      <text x="92" y="332" fill="#cbd5e1" font-size="15">Normalized payload SHA-256</text>
      <text x="92" y="374" fill="#67e8f9" font-size="13" font-weight="700">preview-only runtime</text>
      <text x="92" y="400" fill="#64748b" font-size="13">No controlled create route</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="377" y="178" width="233" height="254" rx="22" fill="#101a2d" stroke="#92400e" stroke-width="2"/>
      <rect x="397" y="198" width="104" height="30" rx="15" fill="#451a03"/>
      <text x="414" y="219" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="1.0">APPROVE</text>
      <text x="397" y="270" fill="#f8fafc" font-size="23" font-weight="700">Human boundary</text>
      <text x="397" y="306" fill="#cbd5e1" font-size="15">Exact summary + payload hash</text>
      <text x="397" y="332" fill="#cbd5e1" font-size="15">Explicit operator approval</text>
      <text x="397" y="374" fill="#fbbf24" font-size="13" font-weight="700">no credential in evidence</text>
      <text x="397" y="400" fill="#64748b" font-size="13">Any change invalidates approval</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="682" y="178" width="233" height="254" rx="22" fill="#101a2d" stroke="#166534" stroke-width="2"/>
      <rect x="702" y="198" width="82" height="30" rx="15" fill="#052e16"/>
      <text x="719" y="219" fill="#34d399" font-size="13" font-weight="800" letter-spacing="1.2">CREATE</text>
      <text x="702" y="270" fill="#f8fafc" font-size="23" font-weight="700">One attempt</text>
      <text x="702" y="306" fill="#cbd5e1" font-size="15">Exact payload re-verified</text>
      <text x="702" y="332" fill="#cbd5e1" font-size="15">Atomic idempotency claim</text>
      <text x="702" y="374" fill="#34d399" font-size="13" font-weight="700">approval-only runtime</text>
      <text x="702" y="400" fill="#64748b" font-size="13">Label evidence preserved</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="987" y="178" width="221" height="254" rx="22" fill="#101a2d" stroke="#6d28d9" stroke-width="2"/>
      <rect x="1007" y="198" width="92" height="30" rx="15" fill="#2e1065"/>
      <text x="1024" y="219" fill="#c4b5fd" font-size="13" font-weight="800" letter-spacing="1.1">OBSERVE</text>
      <text x="1007" y="270" fill="#f8fafc" font-size="23" font-weight="700">Reconcile + track</text>
      <text x="1007" y="306" fill="#cbd5e1" font-size="15">Issuance → freight order</text>
      <text x="1007" y="332" fill="#cbd5e1" font-size="15">Dedupe + monotonic status</text>
      <text x="1007" y="374" fill="#c4b5fd" font-size="13" font-weight="700">observation-only runtime</text>
      <text x="1007" y="400" fill="#64748b" font-size="13">No quote or create route</text>
    </g>

    <rect x="72" y="474" width="1136" height="92" rx="20" fill="url(#rail)" stroke="#334155"/>

    <g transform="translate(98 494)">
      <rect x="4" y="17" width="34" height="27" rx="7" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
      <path d="M12 17v-6c0-8 4.5-12 9-12s9 4 9 12v6" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="21" cy="30" r="3" fill="#34d399"/>
    </g>
    <text x="154" y="511" fill="#f8fafc" font-size="18" font-weight="700">CarrierConnection.enabled = false throughout</text>
    <text x="154" y="538" fill="#94a3b8" font-size="14">Loopback-only · mutually exclusive controlled modes · ≤ 60 min windows · unrelated mutations locked</text>

    <text x="902" y="511" fill="#34d399" font-size="14" font-weight="700">Starken implemented</text>
    <text x="902" y="538" fill="#94a3b8" font-size="14">Other carriers stay behind explicit adapter contracts</text>

    <text x="72" y="592" fill="#64748b" font-size="13">The ceremony proves a controlled shipment path; it never enables normal automation by itself.</text>
  </g>
</svg>
